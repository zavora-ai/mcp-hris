[server]
id = "mcp_hris"
display_name = "HRIS"
version = "1.0.0"
domain = "business-systems"
risk_level = "medium"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []

[[tools]]
name = "list_employees"
description = "List all employees, optionally filtered by department"
risk_class = "read_only"

[[tools]]
name = "get_employee"
description = "Get employee details by ID"
risk_class = "read_only"

[[tools]]
name = "create_employee"
description = "Create a new employee record"
risk_class = "internal_write"

[[tools]]
name = "update_employee"
description = "Update employee fields (title, department, manager, salary)"
risk_class = "internal_write"

[[tools]]
name = "list_departments"
description = "List all departments"
risk_class = "read_only"

[[tools]]
name = "get_department"
description = "Get department details by ID"
risk_class = "read_only"

[[tools]]
name = "request_time_off"
description = "Request time off for an employee"
risk_class = "internal_write"

[[tools]]
name = "list_time_off"
description = "List time-off requests"
risk_class = "read_only"

[[tools]]
name = "approve_time_off"
description = "Approve or deny a time-off request"
risk_class = "internal_write"

[[tools]]
name = "list_payroll"
description = "List payroll records"
risk_class = "read_only"

[[tools]]
name = "run_payroll"
description = "Run payroll for a period"
risk_class = "financial_action"

[[tools]]
name = "get_org_chart"
description = "Get the org chart as a tree structure"
risk_class = "read_only"

[[tools]]
name = "get_headcount"
description = "Get headcount summary by department"
risk_class = "read_only"

[[tools]]
name = "get_directory"
description = "Get employee directory (name, email, title, department)"
risk_class = "read_only"
