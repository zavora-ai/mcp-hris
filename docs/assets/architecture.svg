  <rect x="42" y="135" width="116" height="22" rx="4" fill="#334155"/>
  <text x="100" y="150" text-anchor="middle" fill="#f1f5f9" font-size="10">Claude / Kiro</text>
  <rect x="42" y="163" width="116" height="22" rx="4" fill="#334155"/>
  <text x="100" y="178" text-anchor="middle" fill="#f1f5f9" font-size="10">Cursor / Codex</text>
  <rect x="42" y="191" width="116" height="22" rx="4" fill="#334155"/>
