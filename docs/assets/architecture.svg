  <text x="319" y="131" text-anchor="middle" fill="#64748b" font-size="8">list · get · create</text>
  <text x="319" y="143" text-anchor="middle" fill="#64748b" font-size="8">update</text>
  <text x="319" y="155" text-anchor="middle" fill="#64748b" font-size="8">directory</text>

