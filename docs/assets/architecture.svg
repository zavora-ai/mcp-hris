  <rect x="635" y="199" width="180" height="22" rx="3" fill="#334155"/>
  <text x="725" y="214" text-anchor="middle" fill="#f1f5f9" font-size="9">Rippling API</text>
  <rect x="635" y="227" width="180" height="22" rx="3" fill="#334155"/>
  <text x="725" y="242" text-anchor="middle" fill="#f1f5f9" font-size="9">Local In-Memory (default)</text>

  <text x="450" y="380" text-anchor="middle" fill="#475569" font-size="10">mcp-hris v1.0.0 · 14 tools · Employees, Departments, Time-Off, Payroll, Org Chart</text>
