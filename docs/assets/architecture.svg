  <rect x="42" y="219" width="116" height="22" rx="4" fill="#334155"/>
  <text x="100" y="234" text-anchor="middle" fill="#f1f5f9" font-size="10">Any MCP Client</text>

  <!-- Arrow -->
  <line x1="170" y1="190" x2="230" y2="190" stroke="#6366f1" stroke-width="2"/>
