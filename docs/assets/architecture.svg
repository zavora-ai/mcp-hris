<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="system-ui,-apple-system,sans-serif" font-size="13">
  <defs>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" rx="12" fill="#0f172a"/>
  <text x="450" y="28" text-anchor="middle" fill="#94a3b8" font-size="11">MCP HRIS SERVER — ARCHITECTURE</text>

  <!-- MCP Clients -->
  <rect x="30" y="100" width="140" height="180" rx="8" fill="#1e293b" stroke="#475569"/>
