  <text x="460" y="131" text-anchor="middle" fill="#64748b" font-size="8">list · get</text>
  <text x="460" y="143" text-anchor="middle" fill="#64748b" font-size="8">org_chart</text>
  <text x="460" y="155" text-anchor="middle" fill="#64748b" font-size="8">headcount</text>

  <rect x="252" y="180" width="135" height="55" rx="4" fill="#1e293b"/>
  <text x="319" y="196" text-anchor="middle" fill="#34d399" font-size="9">TIME-OFF (3)</text>
  <text x="319" y="211" text-anchor="middle" fill="#64748b" font-size="8">request · list</text>
  <text x="319" y="223" text-anchor="middle" fill="#64748b" font-size="8">approve/deny</text>

  <rect x="393" y="180" width="135" height="55" rx="4" fill="#1e293b"/>
  <text x="460" y="196" text-anchor="middle" fill="#fb923c" font-size="9">PAYROLL (2)</text>
  <text x="460" y="211" text-anchor="middle" fill="#64748b" font-size="8">list_payroll</text>
  <text x="460" y="223" text-anchor="middle" fill="#64748b" font-size="8">run_payroll</text>

  <rect x="252" y="245" width="276" height="24" rx="4" fill="#1e293b"/>
