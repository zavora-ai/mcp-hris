  <text x="725" y="130" text-anchor="middle" fill="#f1f5f9" font-size="9">BambooHR API</text>
  <rect x="635" y="143" width="180" height="22" rx="3" fill="#334155"/>
  <text x="725" y="158" text-anchor="middle" fill="#f1f5f9" font-size="9">Workday API</text>
  <rect x="635" y="171" width="180" height="22" rx="3" fill="#334155"/>
